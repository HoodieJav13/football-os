name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Generous, because this counts from when the job is created, not from when
    # a runner picks it up: the first run was killed at 15 minutes having never
    # been allocated one, which looks like a test failure and is not.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lesson/package-lock.json

      - run: npm ci --prefix lesson

      # Fast, hermetic checks first: a failure here needs no browser to explain.
      - name: Unit tests
        run: npm run test:unit

      - name: Sites worker tests
        run: npm run test:sites

      # The browser suite runs against dist/, so the build must come first --
      # and a broken build fails here rather than as a confusing timeout.
      - name: Build original editor
        run: npm run build:editor

      - name: Verify the Sites handoff artifacts exist
        run: |
          for artifact in lesson/dist/client/index.html lesson/dist/server/index.js lesson/dist/.openai/hosting.json; do
            test -f "$artifact" || { echo "missing $artifact"; exit 1; }
          done

      # Only Chromium: the suite asserts on behaviour and layout, not on
      # cross-engine rendering, so three browsers would triple the runtime for
      # no extra signal.
      - name: Install Chromium
        working-directory: lesson
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      - name: Build combined workspace
        run: npm run build

      - name: Root routing and cache boundaries
        run: npm test

      - name: Built authoring harness exclusion
        working-directory: lesson
        run: node --test tests/scheme-harness-exclusion.test.mjs

      - name: Combined Author Practice Packet review journeys
        run: npm run test:workflow

      # Screenshots are the fastest way to understand a layout failure that
      # reads as an inscrutable assertion in the log.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: |
            lesson/test-results/
            verification-output/
          if-no-files-found: ignore
          retention-days: 7
